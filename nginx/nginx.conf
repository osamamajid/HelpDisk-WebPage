# Nginx reverse proxy for IT Driver Library
# - Serves frontend static assets + SSR via Next.js
# - Proxies API requests to the FastAPI backend
# - Streams file downloads directly from local storage (efficient)
# - Includes HTTPS-ready server blocks (certbot).

worker_processes auto;
pid /var/run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time';

    access_log /var/log/nginx/access.log main;

    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Large file uploads
    client_max_body_size 0;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # ------------------------------------------------------------------
    # HTTP -> HTTPS redirect (only if HTTPS is configured)
    # ------------------------------------------------------------------
    server {
        listen 80;
        listen [::]:80;
        server_name _;
        # Redirect everything to HTTPS. Uncomment to enforce HTTPS.
        # return 301 https://$host$request_uri;
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
        location / {
            return 200 'IT Driver Library is running';
            add_header Content-Type text/plain;
        }
    }

    # ------------------------------------------------------------------
    # HTTPS server (fill in your domain/certs)
    # ------------------------------------------------------------------
    # server {
    #     listen 443 ssl http2;
    #     server_name drivers.example.com;
    #     ssl_certificate     /etc/letsencrypt/live/drivers.example.com/fullchain.pem;
    #     ssl_certificate_key /etc/letsencrypt/live/drivers.example.com/privkey.pem;
    #     ... (same as below http2 block) ...
    # }

    # ------------------------------------------------------------------
    # Main app server (HTTP) - used in Local mode and as fallback
    # ------------------------------------------------------------------
    server {
        listen 8080;
        listen [::]:8080;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # ---- Static uploads served directly by nginx (fast, no backend hit) ----
        location /storage/ {
            alias /app/storage/;
            # Force download for executable types
            location ~* \.(exe|msi|cab|bin|msu|msp|iso|img)$ {
                add_header Content-Type application/octet-stream;
                add_header Content-Disposition "attachment";
            }
            autoindex off;
            # Prevent execution of scripts inside storage
            location ~* \.(php|phtml|sh|cgi|py|pl|jsp)$ {
                deny all;
            }
        }

        # ---- Backend API ----
        location /api/ {
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            client_max_body_size 0;
        }

        # ---- Health checks ----
        location /healthz {
            proxy_pass http://backend:8000/health;
        }

        # ---- Frontend (Next.js SSR) ----
        location / {
            proxy_pass http://frontend:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
