# ==============================================================================
# IT Driver Library - Docker Compose
#
# Usage:
#   cp .env.example .env
#   docker compose up -d --build
#
# The same compose file works for Local (single host) and Public (VPS) deploys.
# For public HTTPS, put a certbot/traefik in front or terminate TLS in nginx
# using the "nginx-https" profile (requires certificates mounted).
# ==============================================================================
services:
  postgres:
    image: postgres:16-alpine
    container_name: itdriver-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - itdriver

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: itdriver-backend
    restart: unless-stopped
    depends_on:
      - postgres
    env_file:
      - .env
    volumes:
      # Local file storage mapped to the host so files survive container updates.
      - storage_data:/app/storage
    ports:
      - "127.0.0.1:${BACKEND_PORT}:8000"
    networks:
      - itdriver
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: itdriver-frontend
    restart: unless-stopped
    depends_on:
      - backend
    env_file:
      - .env
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    networks:
      - itdriver
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000') instanceof Function"]
      interval: 30s
      timeout: 10s
      retries: 3

  nginx:
    image: nginx:1.27-alpine
    container_name: itdriver-nginx
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "${HTTP_PORT}:80"
      - "${HTTPS_PORT}:443"
      - "127.0.0.1:8080:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - storage_data:/app/storage:ro
      - ./docker/certbot/conf:/etc/letsencrypt:ro
      - ./docker/certbot/www:/var/www/certbot:ro
    networks:
      - itdriver

volumes:
  postgres_data:
  storage_data:

networks:
  itdriver:
    driver: bridge
